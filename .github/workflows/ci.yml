name: CI

on:
  push:
    branches:
      - '**'
    tags-ignore:
      - 'v*'
  pull_request:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  server-container:
    uses: ./.github/workflows/server-image.yml
    with:
      source_ref: ${{ github.event.pull_request.head.sha || github.sha }}
      push_image: false

  version-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Validate changelog-driven version sync
        run: python tools/versioning/sync_version.py --validate

      - name: Test release channel version ordering
        run: python -m unittest tools.versioning.test_release_channel tools.versioning.test_changelog_release tools.versioning.test_sync_version

  server-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            server/requirements.txt
            server/requirements-dev.txt

      - name: Create project-local virtual environment
        run: python -m venv .venv

      - name: Install backend dependencies
        run: |
          ./.venv/bin/python -m pip install --upgrade pip
          ./.venv/bin/python -m pip install -r requirements-dev.txt

      - name: Run backend tests
        run: ./.venv/bin/python -m pytest -q

  admin-web-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin-web
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: admin-web/package-lock.json

      - name: Install admin web dependencies
        run: npm ci

      - name: Test admin web
        run: npm test

      - name: Build admin web
        run: npm run build

  android-check:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.11.1'

      - name: Add Android SDK tools to PATH
        run: |
          if [ -x "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
            echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          elif [ -x "$ANDROID_SDK_ROOT/cmdline-tools/bin/sdkmanager" ]; then
            echo "$ANDROID_SDK_ROOT/cmdline-tools/bin" >> "$GITHUB_PATH"
          else
            echo "sdkmanager not found under $ANDROID_SDK_ROOT" >&2
            find "$ANDROID_SDK_ROOT" -maxdepth 4 -name sdkmanager >&2 || true
            exit 1
          fi
          echo "$ANDROID_SDK_ROOT/platform-tools" >> "$GITHUB_PATH"

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Build Android debug APK
        shell: bash
        run: gradle -p android-client assembleDebug --console=plain 2>&1 | tee android-build.log

      - name: Annotate Android compiler errors
        if: failure()
        run: |
          python - <<'PY'
          from pathlib import Path
          log = Path('android-build.log')
          if log.exists():
              for line in log.read_text(errors='replace').splitlines():
                  if line.startswith('e: ') or 'error:' in line:
                      print('::error::' + line.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A'))
          PY

      - name: Run focused stock scan checks
        timeout-minutes: 10
        shell: bash
        run: >-
          gradle -p android-client :app:testDebugUnitTest
          --tests 'com.componentvault.android.data.MovementLabelResolutionTest'
          --tests 'com.componentvault.android.data.ComponentLocationEditTest'
          --tests 'com.componentvault.android.data.CategoryLearningStoreTest'
          --tests 'com.componentvault.android.data.LcscOrderWorkbookParserTest'
          --tests 'com.componentvault.android.model.LocalComponentSkuTest'
          --tests 'com.componentvault.android.ui.screen.ImportLocationPickerUiTest'
          --tests 'com.componentvault.android.ui.screen.ComponentPhotoSessionTest'
          --tests 'com.componentvault.android.data.InventoryPhotoSyncTest'
          --tests 'com.componentvault.android.data.ImportLearningPersistenceTest'
          --tests 'com.componentvault.android.model.ImportMappingPriorityTest'
          --tests 'com.componentvault.android.ui.screen.QuantityStepperTest'
          --info --console=plain 2>&1 | tee android-stock-tests.log

      - name: Upload stock scan test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-stock-scan-tests
          path: |
            android-stock-tests.log
            android-client/app/build/reports/tests/testDebugUnitTest/
            android-client/app/build/test-results/testDebugUnitTest/

      - name: Run Android inventory regressions
        timeout-minutes: 15
        shell: bash
        run: >-
          gradle -p android-client :app:testDebugUnitTest
          --tests 'com.componentvault.android.data.SyncProtocolTest'
          --tests 'com.componentvault.android.data.SyncAccountIdentityTest'
          --tests 'com.componentvault.android.data.SyncEndpointResolverTest'
          --tests 'com.componentvault.android.data.LcscPublicCatalogTest'
          --tests 'com.componentvault.android.data.LcscDomesticCatalogTest'
          --tests 'com.componentvault.android.data.BluetoothPrinterDiagnosticsTest'
          --tests 'com.componentvault.android.data.M1Spp*Test'
          --tests 'com.componentvault.android.data.M1ComponentLabelRendererTest'
          --tests 'com.componentvault.android.data.LabelPrint*Test'
          --tests 'com.componentvault.android.ui.screen.BluetoothLabelPrintUiTest'
          --tests 'com.componentvault.android.ui.screen.MovementScanFlowTest'
          --tests 'com.componentvault.android.ui.screen.MovementScanEntryUiTest'
          --tests 'com.componentvault.android.ui.screen.InventoryDraftRecoveryTest'
          --tests 'com.componentvault.android.ui.screen.InventoryStateProjectorTest'
          --tests 'com.componentvault.android.ui.screen.MovementBatchCoordinatorTest'
          --tests 'com.componentvault.android.ui.screen.ComponentSaveCoordinatorTest'
          --tests 'com.componentvault.android.ui.screen.BomImportSessionTest'
          --tests 'com.componentvault.android.ui.screen.MovementLocationSelectorTest'
          --tests 'com.componentvault.android.data.LocationQrCodecTest'
          --tests 'com.componentvault.android.data.LcscCatalogRoutePolicyTest'
          --tests 'com.componentvault.android.data.LcscCatalogCacheTest'
          --tests 'com.componentvault.android.data.AppDiagnosticsTest'
          --tests 'com.componentvault.android.data.IssueReportBuilderTest'
          --tests 'com.componentvault.android.data.ImportLookupRequestGateTest'
          --tests 'com.componentvault.android.data.BatchJlcDatabaseTest'
          --tests 'com.componentvault.android.data.BatchJlcModelsTest'
          --tests 'com.componentvault.android.data.ScannedBarcodeSelectorTest'
          --tests 'com.componentvault.android.data.StockAllocationMathTest'
          --tests 'com.componentvault.android.data.BatchTransferTest'
          --tests 'com.componentvault.android.ui.screen.InventorySearchTest'
          --tests 'com.componentvault.android.data.StorageLocationPersistenceTest'
          --tests 'com.componentvault.android.data.InventoryWorkbookCodecTest'
          --tests 'com.componentvault.android.data.InventoryWorkbookServiceTest'
          --tests 'com.componentvault.android.data.LabelWorkbookExporterTest'
          --tests 'com.componentvault.android.data.GitHubReleaseUpdateTest'
          --tests 'com.componentvault.android.model.ComponentImportModelsTest'
          --tests 'com.componentvault.android.data.ServerOfficialDetailsTest'
          --tests 'com.componentvault.android.model.StockMovementRecordTest'
          --tests 'com.componentvault.android.model.StockUsageSummaryTest'
          --tests 'com.componentvault.android.model.OcrEngineModeTest'
          --tests 'com.componentvault.android.ui.screen.UiDateTimeFormatterTest'
          --tests 'com.componentvault.android.ui.screen.StartupFailureDetailsTest'
          --tests 'com.componentvault.android.ui.screen.ContinuousCaptureGateTest'
          --tests 'com.componentvault.android.ui.screen.InventoryNavigationUiTest'
          --tests 'com.componentvault.android.ui.screen.InventoryInteractionUiTest'
          --tests 'com.componentvault.android.ui.screen.MovementsVisibilityUiTest'
          --tests 'com.componentvault.android.ui.screen.OfficialParameterLocalizationTest'
          --tests 'com.componentvault.android.ui.screen.SettingsDraftUiTest'
          --tests 'com.componentvault.android.ui.screen.LocationManagementUiTest'
          --tests 'com.componentvault.android.ui.screen.ImportFlowUiTest'
          --tests 'com.componentvault.android.ui.screen.UiScreenshotTest'
          --tests 'com.componentvault.android.data.SettingsConnectionTest'
          --tests 'com.componentvault.android.data.OfficialCategoryNormalizerTest'
          --tests 'com.componentvault.android.ui.screen.CategoryLocalizationTest'
          --tests 'com.componentvault.android.ui.screen.CategoryFilterSemanticsTest'
          --tests 'com.componentvault.android.data.bom.*'
          --tests 'com.componentvault.android.data.BomReleaseExclusionTest'
          --console=plain 2>&1 | tee android-tests.log

      - name: Upload Android UI review and test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-ui-review
          path: |
            android-client/app/build/reports/ui-screenshots/
            android-client/app/build/reports/tests/testDebugUnitTest/
            android-client/app/build/test-results/testDebugUnitTest/
          if-no-files-found: warn

      - name: Annotate Android test failures
        if: failure()
        run: |
          python - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          log = Path('android-tests.log')
          if log.exists():
              lines = log.read_text(errors='replace').splitlines()
              errors = [line for line in lines if line.startswith('e: ') or 'error:' in line or ' FAILED' in line or 'AssertionError' in line or 'tests completed' in line]
              for line in errors or lines[-40:]:
                  print('::error::' + line.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A'))
          for path in Path('android-client/app/build/test-results/testDebugUnitTest').glob('TEST-*.xml'):
              for case in ET.parse(path).iter('testcase'):
                  for failure in list(case.findall('failure')) + list(case.findall('error')):
                      message = f"{case.get('classname')}.{case.get('name')}: {failure.get('message')}"
                      print('::error::' + message.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A'))
          PY

  windows-build:
    runs-on: windows-latest
    env:
      DOTNET_CLI_HOME: ${{ github.workspace }}\.dotnet-cli
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '9.0.x'

      - name: Run Windows core sync regressions
        run: dotnet test windows-client/ComponentVault.WinUI.CoreTests/ComponentVault.WinUI.CoreTests.csproj -c Release

      - name: Run Windows JLC order import regressions
        run: dotnet test windows-client/ComponentVault.WinUI/Tests/JlcOrderImport/JlcOrderImport.Tests.csproj -c Release

      - name: Run Windows release notes Markdown tests
        run: dotnet test windows-client/ComponentVault.WinUI/Tests/ReleaseNotesMarkdown/ReleaseNotesMarkdown.Tests.csproj -c Release

      - name: Publish Windows portable bundle
        shell: pwsh
        run: |
          dotnet publish windows-client\ComponentVault.WinUI\ComponentVault.WinUI.csproj `
            -c Release `
            -r win-x64 `
            -p:PublishProfile= `
            -p:WindowsPackageType=None `
            -p:GenerateAppxPackageOnBuild=false `
            -p:AppxPackageSigningEnabled=false `
            -p:WindowsAppSDKSelfContained=true `
            -p:SelfContained=true `
            -p:PublishSingleFile=false `
            -o windows-client\artifacts\portable-ci

      - name: Smoke test Windows portable startup
        shell: pwsh
        run: |
          $publishDir = Join-Path $env:GITHUB_WORKSPACE 'windows-client\artifacts\portable-ci'
          Get-ChildItem -LiteralPath $publishDir -Recurse -File |
            Where-Object { $_.Extension -in '.xbf', '.pri' } |
            ForEach-Object { "{0} ({1} bytes)" -f [IO.Path]::GetRelativePath($publishDir, $_.FullName), $_.Length }
          $executable = Join-Path $publishDir 'ComponentVault.WinUI.exe'
          $marker = Join-Path $env:RUNNER_TEMP 'component-vault-startup-ready'
          Remove-Item -LiteralPath $marker -Force -ErrorAction SilentlyContinue
          $env:COMPONENT_VAULT_STARTUP_SMOKE_FILE = $marker
          $process = Start-Process -FilePath $executable -WorkingDirectory $publishDir -WindowStyle Hidden -PassThru
          try {
            if (-not $process.WaitForExit(30000)) {
              throw 'Windows portable startup smoke timed out before the app reported ready.'
            }
            if ($process.ExitCode -ne 0) {
              throw "Windows portable startup smoke exited with code $($process.ExitCode)."
            }
            if (!(Test-Path -LiteralPath $marker)) {
              throw 'Windows portable app exited without completing MainWindow startup.'
            }
          } catch {
            $startupLog = Join-Path $env:LOCALAPPDATA 'ComponentVault\logs\startup.log'
            if (Test-Path -LiteralPath $startupLog) {
              Get-Content -LiteralPath $startupLog
            }
            throw
          } finally {
            if (!$process.HasExited) {
              Stop-Process -Id $process.Id -Force
            }
          }

      - name: Upload Windows startup resources on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-startup-resources
          path: |
            windows-client/artifacts/portable-ci/**/*.pri
            windows-client/artifacts/portable-ci/**/*.xbf
          if-no-files-found: warn
