name: Docker Images

on:
  workflow_call:
    inputs:
      source_ref:
        required: false
        default: ''
        type: string
      release_tag:
        required: false
        default: ''
        type: string
      push_image:
        required: false
        default: false
        type: boolean
      promote_channel:
        required: false
        default: false
        type: boolean
    secrets:
      DOCKERHUB_TOKEN:
        required: false
  workflow_dispatch:
    inputs:
      source_ref:
        description: Git ref to check. Defaults to release_tag when set, otherwise the workflow SHA.
        required: false
        default: ''
        type: string
      release_tag:
        description: Git release tag to publish, e.g. v0.7.9-dev.16 or v0.7.9.
        required: false
        type: string
      push_image:
        description: Publish to the configured Docker Hub repository after startup checks.
        required: true
        default: false
        type: boolean
      promote_channel:
        description: Also update the dev or stable channel after verifying the fixed pair. Leave off for historical backfills.
        required: false
        default: false
        type: boolean
  push:
    tags:
      - 'v*'

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  server-image:
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ (inputs.push_image || (github.event_name == 'push' && github.ref_type == 'tag')) && 'component-vault-dockerhub-publish' || format('component-vault-docker-ci-{0}', github.run_id) }}
      queue: max
    env:
      RELEASE_TAG: ${{ inputs.release_tag || (github.ref_type == 'tag' && github.ref_name) || '' }}
      PROMOTE_CHANNEL: ${{ (inputs.push_image && inputs.promote_channel) || (github.event_name == 'push' && github.ref_type == 'tag') }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_ref || inputs.release_tag || github.sha }}

      - name: Record checked-out build identity
        id: build_identity
        run: |
          echo "version=${RELEASE_TAG:-source}" >> "$GITHUB_OUTPUT"
          echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Validate publishing configuration
        if: inputs.push_image || (github.event_name == 'push' && github.ref_type == 'tag')
        env:
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          DOCKERHUB_IMAGE: ${{ vars.DOCKERHUB_IMAGE }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          for name in DOCKERHUB_USERNAME DOCKERHUB_IMAGE DOCKERHUB_TOKEN; do
            if [ -z "${!name}" ]; then
              echo "::error::Configure ${name} in repository Actions variables/secrets before publishing."
              exit 1
            fi
          done
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-dev\.[1-9][0-9]*)?$ ]]; then
            echo '::error::release_tag must be a stable or dev release tag, for example v0.7.9 or v0.7.9-dev.5.'
            exit 1
          fi
          git fetch --no-tags --depth=1 origin "refs/tags/$RELEASE_TAG"
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse 'FETCH_HEAD^{commit}')" ]; then
            echo '::error::source_ref must identify the same commit as release_tag.'
            exit 1
          fi
          if [[ ! "$DOCKERHUB_IMAGE" =~ ^[a-z0-9][a-z0-9_-]*/[a-z0-9][a-z0-9_.-]*$ ]]; then
            echo '::error::DOCKERHUB_IMAGE must be namespace/repository without a tag.'
            exit 1
          fi

      - name: Set up QEMU
        if: inputs.push_image || (github.event_name == 'push' && github.ref_type == 'tag')
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Set up Python for updater checks
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: updater/requirements*.txt

      - name: Verify updater jobs and deployment helper
        run: |
          python -m venv updater/.venv
          updater/.venv/bin/python -m pip install -r updater/requirements-dev.txt
          updater/.venv/bin/python -m unittest updater.test_app updater.test_helper -v

      - name: Build image for startup validation
        uses: docker/build-push-action@v7
        with:
          context: ./server
          build-args: |
            APP_VERSION=${{ steps.build_identity.outputs.version }}
            APP_REVISION=${{ steps.build_identity.outputs.revision }}
          platforms: linux/amd64
          load: true
          tags: component-vault-server:ci
          cache-from: type=gha,scope=server-image
          cache-to: type=gha,mode=max,scope=server-image

      - name: Build shared management image for startup validation
        uses: docker/build-push-action@v7
        with:
          context: .
          file: admin-web/Dockerfile
          platforms: linux/amd64
          load: true
          tags: component-vault-management:ci
          cache-from: type=gha,scope=web-image
          cache-to: type=gha,mode=max,scope=web-image

      - name: Verify Compose first-run configuration schema
        run: python tools/deployment/verify-compose-config.py

      - name: Verify updater startup, authentication and persisted failed jobs
        run: |
          mkdir -p "$RUNNER_TEMP/updater-data" "$RUNNER_TEMP/updater-state"
          printf '%s' 'ci-updater-token' > "$RUNNER_TEMP/updater-data/.updater-token"
          docker run -d --name component-vault-updater-ci \
            -p 127.0.0.1:18790:8790 \
            -e UPDATE_PROJECT_NAME=isolated-missing-project \
            -v "$RUNNER_TEMP/updater-data:/data:ro" \
            -v "$RUNNER_TEMP/updater-state:/state" \
            component-vault-management:ci updater
          trap 'docker logs component-vault-updater-ci; docker rm -f component-vault-updater-ci' EXIT
          curl --fail --silent --show-error --retry 12 --retry-delay 1 --retry-all-errors --max-time 3 \
            --output /dev/null http://127.0.0.1:18790/health
          docker exec component-vault-updater-ci /usr/local/bin/componentvault-healthcheck
          docker exec component-vault-updater-ci python -c "import socket; s=socket.socket(); assert s.connect_ex(('127.0.0.1', 80)) != 0, 'Updater must not listen on the Web port'"
          python - <<'PY'
          import json
          import time
          import urllib.error
          import urllib.request

          base = 'http://127.0.0.1:18790'
          def request(path, data=None, authenticated=True):
              headers = {'Authorization': 'Bearer ci-updater-token'} if authenticated else {}
              if data is not None:
                  headers['Content-Type'] = 'application/json'
              body = json.dumps(data).encode() if data is not None else None
              with urllib.request.urlopen(urllib.request.Request(base + path, data=body, headers=headers), timeout=5) as response:
                  return json.load(response)
          try:
              request('/status', authenticated=False)
              raise AssertionError('Updater must require its shared token.')
          except urllib.error.HTTPError as error:
              assert error.code == 401
          assert request('/status')['active_job'] is None
          job = request('/jobs', {'channel': 'dev', 'request_id': 'ci-no-docker-socket'})
          assert job['status'] in ('queued', 'running')
          for _ in range(40):
              job = request('/jobs/ci-no-docker-socket')
              if job['status'] == 'failed':
                  break
              time.sleep(0.5)
          assert job['status'] == 'failed' and job['message'], job
          PY
          docker restart component-vault-updater-ci
          curl --fail --silent --show-error --retry 12 --retry-delay 1 --retry-all-errors --max-time 3 \
            -H 'Authorization: Bearer ci-updater-token' \
            --output "$RUNNER_TEMP/updater-status.json" http://127.0.0.1:18790/status
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          status = json.loads((Path(os.environ['RUNNER_TEMP']) / 'updater-status.json').read_text())
          assert status['latest_job']['id'] == 'ci-no-docker-socket', status
          assert status['latest_job']['status'] == 'failed', status
          PY

      - name: Verify server first-run setup and persistence
        run: bash tools/deployment/verify-first-run.sh component-vault-server:ci

      - name: Verify API startup, authentication and mounted database
        run: |
          mkdir -p "$RUNNER_TEMP/component-vault-data"
          docker run -d --name component-vault-api-ci \
            -p 127.0.0.1:18787:8787 \
            -e API_TOKEN=ci-smoke-token \
            -v "$RUNNER_TEMP/component-vault-data:/data" \
            component-vault-server:ci
          trap 'docker logs component-vault-api-ci; docker rm -f component-vault-api-ci' EXIT
          curl --fail --silent --show-error --retry 12 --retry-delay 1 --retry-all-errors --max-time 3 \
            --output "$RUNNER_TEMP/server-health.json" http://127.0.0.1:18787/health
          curl --fail -X POST -H 'Authorization: Bearer ci-smoke-token' \
            http://127.0.0.1:18787/auth/ping > "$RUNNER_TEMP/server-auth.json"
          curl --fail --silent --show-error -H 'Authorization: Bearer ci-smoke-token' \
            http://127.0.0.1:18787/auth/me > "$RUNNER_TEMP/server-identity.json"
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:18787/auth/ping)" = 401
          python - <<'PY'
          import json
          import os
          import sqlite3
          from pathlib import Path

          root = Path(os.environ['RUNNER_TEMP'])
          for filename in ('server-health.json', 'server-auth.json'):
              result = json.loads((root / filename).read_text())
              assert result['status'] == 'ok', result
              assert result['inventory_protocol'] == 1, result
          identity = json.loads((root / 'server-identity.json').read_text())
          assert identity['server_id'] and identity['account_id'] == 'admin', identity
          assert identity['role'] == 'admin', identity
          health = json.loads((root / 'server-health.json').read_text())
          assert health['version'], health
          assert len(health['revision']) == 40, health
          database = root / 'component-vault-data' / 'component_vault.db'
          assert database.is_file(), 'Database must be persisted in the mounted /data directory.'
          with sqlite3.connect(f'file:{database}?mode=ro', uri=True) as connection:
              assert connection.execute('PRAGMA quick_check').fetchone()[0] == 'ok'
          PY

      - name: Verify web startup and bundled assets
        run: |
          docker run -d --name component-vault-web-ci \
            -p 127.0.0.1:18081:80 \
            component-vault-management:ci
          trap 'docker logs component-vault-web-ci; docker rm -f component-vault-web-ci' EXIT
          curl --fail --silent --show-error --retry 12 --retry-delay 1 --retry-all-errors --max-time 3 \
            --output "$RUNNER_TEMP/admin-index.html" http://127.0.0.1:18081/
          docker exec component-vault-web-ci /usr/local/bin/componentvault-healthcheck
          docker exec component-vault-web-ci python -c "import socket; s=socket.socket(); assert s.connect_ex(('127.0.0.1', 8790)) != 0, 'Web must not listen on the updater port'"
          test "$(docker inspect --format '{{len .Mounts}}' component-vault-web-ci)" = 0
          mapfile -t assets < <(
            grep -oE '(src|href)="/assets/[^"]+"' "$RUNNER_TEMP/admin-index.html" \
              | cut -d'"' -f2
          )
          test "${#assets[@]}" -gt 0
          printf '%s\n' "${assets[@]}" | grep -qE '\.js($|\?)'
          printf '%s\n' "${assets[@]}" | grep -qE '\.css($|\?)'
          for asset in "${assets[@]}"; do
            curl --fail --silent --show-error --max-time 3 \
              --output /dev/null "http://127.0.0.1:18081$asset"
          done

      - name: Login to Docker Hub
        if: inputs.push_image || (github.event_name == 'push' && github.ref_type == 'tag')
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Resolve version and channel image tags
        if: inputs.push_image || (github.event_name == 'push' && github.ref_type == 'tag')
        id: image_tags
        env:
          IMAGE: ${{ vars.DOCKERHUB_IMAGE }}
        run: |
          version="${RELEASE_TAG#v}"
          channel=latest
          update_channel=stable
          if [[ "$version" == *-dev.* ]]; then
            channel=dev
            update_channel=dev
          fi
          {
            echo "api_version=$IMAGE:$version"
            echo "web_version=$IMAGE:web-$version"
            echo "api_channel=$IMAGE:$channel"
            echo "web_channel=$IMAGE:web-$channel"
            echo "update_channel=$update_channel"
          } >> "$GITHUB_OUTPUT"

      - name: Publish fixed multi-platform API image
        if: inputs.push_image || (github.event_name == 'push' && github.ref_type == 'tag')
        id: published_api
        uses: docker/build-push-action@v7
        with:
          context: ./server
          build-args: |
            APP_VERSION=${{ steps.build_identity.outputs.version }}
            APP_REVISION=${{ steps.build_identity.outputs.revision }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.image_tags.outputs.api_version }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ env.RELEASE_TAG }}
            org.opencontainers.image.revision=${{ steps.build_identity.outputs.revision }}
          cache-from: type=gha,scope=server-image
          cache-to: type=gha,mode=max,scope=server-image

      - name: Publish fixed multi-platform management image
        if: inputs.push_image || (github.event_name == 'push' && github.ref_type == 'tag')
        id: published_web
        uses: docker/build-push-action@v7
        with:
          context: .
          file: admin-web/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.image_tags.outputs.web_version }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ env.RELEASE_TAG }}
            org.opencontainers.image.revision=${{ steps.build_identity.outputs.revision }}
          cache-from: type=gha,scope=web-image
          cache-to: type=gha,mode=max,scope=web-image

      - name: Verify fixed images on Docker Hub
        if: inputs.push_image || (github.event_name == 'push' && github.ref_type == 'tag')
        shell: bash
        env:
          API_VERSION: ${{ steps.image_tags.outputs.api_version }}
          WEB_VERSION: ${{ steps.image_tags.outputs.web_version }}
          API_DIGEST: ${{ steps.published_api.outputs.digest }}
          WEB_DIGEST: ${{ steps.published_web.outputs.digest }}
          EXPECTED_REVISION: ${{ steps.build_identity.outputs.revision }}
        run: |
          verify_image() {
            local image=$1 digest=$2
            [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
            test "$(docker buildx imagetools inspect "$image" --format '{{.Manifest.Digest}}')" = "$digest"
            docker buildx imagetools inspect --raw "$image" | jq -e '
              [.manifests[] | select(.platform.os == "linux") | .platform.architecture]
              | unique == ["amd64", "arm64"]
            ' >/dev/null
            docker pull --platform linux/amd64 "$image"
            test "$(docker image inspect "$image" --format '{{index .Config.Labels "org.opencontainers.image.version"}}')" = "$RELEASE_TAG"
            test "$(docker image inspect "$image" --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')" = "$EXPECTED_REVISION"
          }
          verify_image "$API_VERSION" "$API_DIGEST"
          verify_image "$WEB_VERSION" "$WEB_DIGEST"

      - name: Check out release workflow tools
        if: env.PROMOTE_CHANNEL == 'true' && steps.build_identity.outputs.revision != github.workflow_sha
        uses: actions/checkout@v6
        with:
          ref: ${{ github.workflow_sha }}
          path: .release-tools

      - name: Verify real Web-triggered Compose update using fixed images
        if: env.PROMOTE_CHANNEL == 'true'
        timeout-minutes: 12
        env:
          UPDATE_CHANNEL: ${{ steps.image_tags.outputs.update_channel }}
          DOCKERHUB_IMAGE: ${{ vars.DOCKERHUB_IMAGE }}
          EXPECTED_REVISION: ${{ steps.build_identity.outputs.revision }}
        run: |
          script=tools/deployment/verify-web-update.sh
          if [[ -f ".release-tools/$script" ]]; then script=".release-tools/$script"; fi
          bash "$script"

      - name: Promote the verified image pair to the channel
        if: env.PROMOTE_CHANNEL == 'true'
        env:
          IMAGE: ${{ vars.DOCKERHUB_IMAGE }}
          API_CHANNEL: ${{ steps.image_tags.outputs.api_channel }}
          WEB_CHANNEL: ${{ steps.image_tags.outputs.web_channel }}
          API_DIGEST: ${{ steps.published_api.outputs.digest }}
          WEB_DIGEST: ${{ steps.published_web.outputs.digest }}
        run: |
          digest_of() {
            docker buildx imagetools inspect "$1" --format '{{.Manifest.Digest}}'
          }
          promote() {
            local tag=$1 digest=$2 attempt
            for attempt in 1 2 3; do
              if docker buildx imagetools create --tag "$tag" "$IMAGE@$digest" &&
                test "$(digest_of "$tag")" = "$digest"; then
                return 0
              fi
              if (( attempt < 3 )); then sleep 5; fi
            done
            return 1
          }
          previous_api=$(digest_of "$API_CHANNEL" || true)
          previous_web=$(digest_of "$WEB_CHANNEL" || true)
          if ! promote "$API_CHANNEL" "$API_DIGEST" || ! promote "$WEB_CHANNEL" "$WEB_DIGEST"; then
            echo '::error::Channel promotion did not complete. The fixed images are still published.'
            if [[ "$previous_api" =~ ^sha256:[0-9a-f]{64}$ && "$previous_web" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              restored=true
              promote "$API_CHANNEL" "$previous_api" || restored=false
              promote "$WEB_CHANNEL" "$previous_web" || restored=false
              if [[ "$restored" == true ]]; then
                echo 'Restored the previous channel pair.'
              else
                echo '::error::Could not restore the previous channel pair. Check both aliases before retrying.'
              fi
            fi
            exit 1
          fi
