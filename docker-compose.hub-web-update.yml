# Single-image Hub deployment with separate API, Web and optional updater roles.
# Requires a unified-image release; use the release's own template for older versions.
# Keep the existing Compose project name. Set COMPONENT_VAULT_DEPLOY_DIR
# to this directory's absolute NAS/host path in .env.
# The default channel is latest (unified from stable 0.7.9).
# Set COMPONENT_VAULT_DOCKER_CHANNEL=dev in .env to follow development releases.
# Existing deployments must retain their original ports and /data source.
services:
  api:
    image: ${COMPONENT_VAULT_IMAGE:-rafaelikaros/component_manager:${COMPONENT_VAULT_DOCKER_CHANNEL:-latest}}
    ports:
      - "8787:8787"
    environment:
      # Optional overrides for existing deployments. Set up new installations in /setup.
      ADMIN_WEB_ORIGINS: ${ADMIN_WEB_ORIGINS:-}
      ADMIN_WEB_URL: ${ADMIN_WEB_URL:-}
      API_TOKEN: ${API_TOKEN:-}
      CONFIG_PATH: ${CONFIG_PATH:-}
      LOG_DIR: ${LOG_DIR:-}
      UPDATER_URL: http://updater:8790
      WEB_INVENTORY_ENABLED: ${WEB_INVENTORY_ENABLED:-}
    labels:
      io.componentvault.compose-layout: unified
      com.centurylinklabs.watchtower.enable: "false"
    volumes:
      - component_vault_data:/data
    restart: unless-stopped

  admin-web:
    image: &management-image ${COMPONENT_VAULT_WEB_IMAGE:-${COMPONENT_VAULT_IMAGE:-rafaelikaros/component_manager:${COMPONENT_VAULT_DOCKER_CHANNEL:-latest}}}
    command: [web]
    depends_on:
      - api
    ports:
      - "8081:80"
    labels:
      com.centurylinklabs.watchtower.enable: "false"
    restart: unless-stopped

  updater:
    # Same management image as admin-web; a separate process and container.
    image: *management-image
    command: [updater]
    environment:
      UPDATE_PROJECT_NAME: ${COMPOSE_PROJECT_NAME:?Choose the original Compose project name}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - component_vault_data:/data:ro
      - component_vault_updater_state:/state
      # Compose resolves the original project files at this same absolute path.
      - type: bind
        source: &deployment-directory ${COMPONENT_VAULT_DEPLOY_DIR:?Set the absolute original Compose deployment directory}
        target: *deployment-directory
        bind:
          create_host_path: true
    restart: unless-stopped

volumes:
  component_vault_data: {}
  component_vault_updater_state: {}
