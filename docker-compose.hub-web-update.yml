# Single-file Hub deployment with Web administration and optional Web updates.
# Keep the existing Compose project name. Set COMPONENT_VAULT_DEPLOY_DIR
# to this directory's absolute NAS/host path in .env.
# Until a compatible stable release is available, set
# COMPONENT_VAULT_DOCKER_CHANNEL=dev in .env before the first deployment.
# Existing deployments must retain their original ports and /data source.
services:
  api:
    image: ${COMPONENT_VAULT_IMAGE:-rafaelikaros/component_manager:${COMPONENT_VAULT_DOCKER_CHANNEL:-latest}}
    ports:
      - "8787:8787"
    environment:
      # Optional overrides for existing deployments. Set up new installations in /setup.
      API_TOKEN: ${API_TOKEN:-}
      CONFIG_PATH: ${CONFIG_PATH:-}
      LOG_DIR: ${LOG_DIR:-}
      ADMIN_WEB_ORIGINS: ${ADMIN_WEB_ORIGINS:-}
      ADMIN_WEB_URL: ${ADMIN_WEB_URL:-}
      WEB_INVENTORY_ENABLED: ${WEB_INVENTORY_ENABLED:-}
      UPDATER_URL: http://updater:8790
    labels:
      com.centurylinklabs.watchtower.enable: "false"
    volumes:
      - component_vault_data:/data
    restart: unless-stopped

  admin-web:
    image: ${COMPONENT_VAULT_WEB_IMAGE:-rafaelikaros/component_manager:web-${COMPONENT_VAULT_DOCKER_CHANNEL:-latest}}
    depends_on:
      - api
    ports:
      - "8081:80"
    labels:
      com.centurylinklabs.watchtower.enable: "false"
    restart: unless-stopped

  updater:
    # Same management image as admin-web; a separate process and container.
    image: ${COMPONENT_VAULT_WEB_IMAGE:-rafaelikaros/component_manager:web-${COMPONENT_VAULT_DOCKER_CHANNEL:-latest}}
    command: [updater]
    environment:
      UPDATE_PROJECT_NAME: ${COMPOSE_PROJECT_NAME:?Choose the original Compose project name}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - component_vault_data:/data:ro
      - component_vault_updater_state:/state
      - ${COMPONENT_VAULT_DEPLOY_DIR:?Set the absolute original Compose deployment directory}:${COMPONENT_VAULT_DEPLOY_DIR:?Set the absolute original Compose deployment directory}:rw
    restart: unless-stopped

volumes:
  component_vault_data:
  component_vault_updater_state:
