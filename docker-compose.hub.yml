# Pull the published API image instead of building from source.
# Defaults to the floating latest/web-latest API and Web tags.
# Set COMPONENT_VAULT_DOCKER_CHANNEL=dev for dev/web-dev; latest restores stable.
# Full image overrides take precedence over the channel.
# Pull before updating; check Docker Hub tags before selecting fixed release tags.
services:
  api:
    image: ${COMPONENT_VAULT_IMAGE:-rafaelikaros/component_manager:${COMPONENT_VAULT_DOCKER_CHANNEL:-latest}}
    ports:
      - "8787:8787"
    environment:
      # Optional overrides for existing deployments. Set up new installations in /setup.
      API_TOKEN: ${API_TOKEN:-}
      CONFIG_PATH: ${CONFIG_PATH:-}
      LOG_DIR: ${LOG_DIR:-}
      ADMIN_WEB_ORIGINS: ${ADMIN_WEB_ORIGINS:-}
      ADMIN_WEB_URL: ${ADMIN_WEB_URL:-}
      WEB_INVENTORY_ENABLED: ${WEB_INVENTORY_ENABLED:-}
    volumes:
      - component_vault_data:/data
    restart: unless-stopped

  admin-web:
    profiles:
      - web
    image: ${COMPONENT_VAULT_WEB_IMAGE:-rafaelikaros/component_manager:web-${COMPONENT_VAULT_DOCKER_CHANNEL:-latest}}
    depends_on:
      - api
    ports:
      - "8081:80"
    restart: unless-stopped

volumes:
  component_vault_data:
