# Deploy published Docker Hub images. Enable the web profile to start the Web console.
# Requires a release with the unified image layout. Older releases use their own template.
# All roles use latest or dev; the command selects the service.
# Full image overrides take precedence over the channel.
# Pull before updating; check Docker Hub tags before selecting fixed release tags.
services:
  api:
    image: ${COMPONENT_VAULT_IMAGE:-rafaelikaros/component_manager:${COMPONENT_VAULT_DOCKER_CHANNEL:-latest}}
    labels:
      io.componentvault.compose-layout: unified
    ports:
      - "8787:8787"
    environment:
      # Optional overrides for existing deployments. Set up new installations in /setup.
      ADMIN_WEB_ORIGINS: ${ADMIN_WEB_ORIGINS:-}
      ADMIN_WEB_URL: ${ADMIN_WEB_URL:-}
      API_TOKEN: ${API_TOKEN:-}
      CONFIG_PATH: ${CONFIG_PATH:-}
      LOG_DIR: ${LOG_DIR:-}
      WEB_INVENTORY_ENABLED: ${WEB_INVENTORY_ENABLED:-}
    volumes:
      - component_vault_data:/data
    restart: unless-stopped

  admin-web:
    profiles:
      - web
    image: ${COMPONENT_VAULT_WEB_IMAGE:-${COMPONENT_VAULT_IMAGE:-rafaelikaros/component_manager:${COMPONENT_VAULT_DOCKER_CHANNEL:-latest}}}
    command: [web]
    depends_on:
      - api
    ports:
      - "8081:80"
    restart: unless-stopped

volumes:
  component_vault_data: {}
