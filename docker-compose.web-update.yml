# Optional Web-triggered updates for an existing official Hub Compose project.
# Set COMPONENT_VAULT_DEPLOY_DIR to its absolute host directory, at the same path
# inside the updater. Keep the original Compose project name and data volume.
services:
  api:
    environment:
      UPDATER_URL: http://updater:8790
    labels:
      com.centurylinklabs.watchtower.enable: "false"

  admin-web:
    labels:
      com.centurylinklabs.watchtower.enable: "false"

  updater:
    # Same management image as admin-web; a separate process and container.
    image: ${COMPONENT_VAULT_WEB_IMAGE:-rafaelikaros/component_manager:web-${COMPONENT_VAULT_DOCKER_CHANNEL:-latest}}
    command: [updater]
    environment:
      UPDATE_PROJECT_NAME: ${COMPOSE_PROJECT_NAME:?Choose the original Compose project name}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - component_vault_data:/data:ro
      - component_vault_updater_state:/state
      # Compose resolves the original project files at this same absolute path.
      - type: bind
        source: &deployment-directory ${COMPONENT_VAULT_DEPLOY_DIR:?Set the absolute original Compose deployment directory}
        target: *deployment-directory
        bind:
          create_host_path: true
    restart: unless-stopped

volumes:
  component_vault_updater_state: {}
