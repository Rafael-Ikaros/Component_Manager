services:
  api:
    build:
      context: ./server
    ports:
      - "8787:8787"
    environment:
      # Optional overrides for existing deployments. Set up new installations in /setup.
      API_TOKEN: ${API_TOKEN:-}
      CONFIG_PATH: ${CONFIG_PATH:-}
      LOG_DIR: ${LOG_DIR:-}
      ADMIN_WEB_ORIGINS: ${ADMIN_WEB_ORIGINS:-}
      ADMIN_WEB_URL: ${ADMIN_WEB_URL:-}
      WEB_INVENTORY_ENABLED: ${WEB_INVENTORY_ENABLED:-}
    volumes:
      - component_vault_data:/data

  admin-web:
    build:
      context: .
      dockerfile: admin-web/Dockerfile
      args:
        VITE_DEFAULT_API_BASE_URL: ${VITE_DEFAULT_API_BASE_URL:-}
    depends_on:
      - api
    ports:
      - "8081:80"

volumes:
  component_vault_data:
