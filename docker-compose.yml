# Build one image, then run the API and Web as separate roles.
services:
  api:
    image: component-vault:local
    build: &unified-build
      context: .
      target: api
      args:
        VITE_DEFAULT_API_BASE_URL: ${VITE_DEFAULT_API_BASE_URL:-}
    labels:
      io.componentvault.compose-layout: unified
    ports:
      - "8787:8787"
    environment:
      # Optional overrides for existing deployments. Set up new installations in /setup.
      ADMIN_WEB_ORIGINS: ${ADMIN_WEB_ORIGINS:-}
      ADMIN_WEB_URL: ${ADMIN_WEB_URL:-}
      API_TOKEN: ${API_TOKEN:-}
      CONFIG_PATH: ${CONFIG_PATH:-}
      LOG_DIR: ${LOG_DIR:-}
      WEB_INVENTORY_ENABLED: ${WEB_INVENTORY_ENABLED:-}
    volumes:
      - component_vault_data:/data

  admin-web:
    image: component-vault:local
    build: *unified-build
    command: [web]
    depends_on:
      - api
    ports:
      - "8081:80"

volumes:
  component_vault_data: {}
