<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Component Vault · 平板布局预览</title><style>
:root{--primary:#0f766e;--container:#d5f3ee;--bg:#f3f7f6;--line:#dce5e2;--muted:#526963;--ink:#1b302b;--surface:#fff}*{box-sizing:border-box}body{margin:0;background:#e5ebe8;color:var(--ink);font:14px/1.5 "Noto Sans SC","Microsoft YaHei",system-ui,sans-serif}button,input,select{font:inherit}button{cursor:pointer;min-height:48px;padding:0 16px;background:transparent;border:0;border-radius:24px;color:inherit;white-space:nowrap}button:hover{background:#e6efec}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #375c8a;outline-offset:2px}button.active,.pill.active{background:var(--container);color:#003733}.primary{background:var(--primary);color:white}.primary:hover{background:#095e57}.outline{border:1px solid #99ada7}.icon{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.7;vertical-align:middle;flex-shrink:0}.previewbar{background:#203b35;color:#fff;padding:12px 24px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}.previewbar strong{font-size:15px}.previewbar button{color:#fff;border:1px solid #80948e}.previewbar button.active{background:#d5f3ee;color:#003733}.previewbar .spacer{flex:1}.examples{display:flex;gap:6px;padding:8px 24px;background:white;overflow:auto;border-bottom:1px solid var(--line)}.stage{padding:24px;overflow:auto}.device{width:1280px;height:800px;margin:auto;background:var(--bg);display:flex;overflow:hidden;border-radius:20px;border:1px solid #bccdc6;box-shadow:0 6px 24px #1d392818;position:relative;container-type:inline-size}.device.portrait{width:840px;height:1100px}.rail{width:96px;flex:none;border-right:1px solid var(--line);padding:24px 8px;display:flex;align-items:center;flex-direction:column;gap:12px}.brand{height:48px;width:48px;border-radius:16px;background:var(--primary);color:white;display:grid;place-items:center;margin-bottom:18px}.rail button{border-radius:16px;width:80px;height:72px;padding:8px 0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:12px}.workspace{flex:1;min-width:0;display:flex;flex-direction:column}.pagehead{padding:24px 28px 16px;display:flex;align-items:center;gap:16px}.pagehead h1{font-size:26px;font-weight:600;margin:0}.sub{color:var(--muted);font-size:13px}.grow{flex:1}.content{padding:0 24px 24px;flex:1;min-height:0;display:flex;gap:16px}.panel{background:white;border:1px solid var(--line);border-radius:16px;min-width:0;overflow:auto}.mainpanel{flex:1}.sidepanel{width:352px;flex:none;padding:20px}.toolbar{display:flex;gap:8px;align-items:center;padding:16px;flex-wrap:wrap;border-bottom:1px solid var(--line)}input,select{min-height:48px;background:#f7faf9;border:1px solid #9eb0aa;border-radius:8px;padding:10px 12px;min-width:0;color:var(--ink)}.search{flex:1;min-width:150px}.filters{display:flex;padding:12px 16px;gap:8px;flex-wrap:wrap}.pill{min-height:48px;border:1px solid #b4c7c0;border-radius:12px}.tablewrap{overflow:auto}table{border-collapse:collapse;width:100%;white-space:nowrap;text-align:left}th{font-size:12px;color:var(--muted);font-weight:500;background:#f7faf9;height:44px}th,td{padding:10px 14px;border-bottom:1px solid #e8efeb}td{height:64px;font-size:14px}tr[data-row]{cursor:pointer}tr[data-row]:hover{background:#f0f7f4}tr.selected{background:#e5f5f0}td small{display:block;color:var(--muted);font-size:12px}.modelname{display:block;max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.detailtop h2{min-width:0;overflow-wrap:anywhere}.stock{font-weight:650;color:var(--primary)}.low{color:#9b5c00}.detailtop{display:flex;align-items:center;gap:8px}.detailtop h2{font-size:20px;margin:0;flex:1}.photo{height:132px;margin:16px 0;background:#f1f5f3;border-radius:12px;display:flex;align-items:center;justify-content:center;gap:12px;color:#60776e}.chipdrawing{width:60px;height:48px;background:#40534d;border-radius:5px;position:relative;color:#cde8e2;display:grid;place-items:center;font-size:11px}.chipdrawing:before,.chipdrawing:after{content:"";position:absolute;left:-8px;right:-8px;height:6px;background:repeating-linear-gradient(90deg,#9faea8 0 5px,transparent 5px 10px)}.chipdrawing:before{top:-6px}.chipdrawing:after{bottom:-6px}.meta{display:grid;grid-template-columns:1fr 1fr;gap:16px 12px;margin:20px 0}.meta label{display:block;color:var(--muted);font-size:12px}.meta strong{font-size:14px;font-weight:550}.quantity{display:flex;align-items:baseline;gap:8px;border-top:1px solid var(--line);padding-top:16px}.quantity b{font-size:30px;color:var(--primary)}.actions{display:flex;gap:8px;margin-top:16px}.actions button{flex:1;padding:0 10px}.note{padding:12px 14px;background:#eef6f2;border-radius:10px;color:var(--muted);font-size:13px;margin:16px 0}.sectiontitle{font-size:15px;margin:20px 0 12px}.hidden{display:none!important}.detail-toggle{display:none}.close-detail{display:none}.bottomline{padding:12px 16px;display:flex;align-items:center;gap:12px;border-top:1px solid var(--line);color:var(--muted)}.simplelist button{border-radius:0;display:block;width:100%;text-align:left;min-height:68px;border-bottom:1px solid var(--line)}.simplelist small{display:block;color:var(--muted)}.settingsnav{width:220px;padding:12px;flex:none}.settingsnav button{display:block;width:100%;text-align:left;border-radius:12px}.formpanel{flex:1;padding:24px}.formbody{max-width:560px}.formbody h2{font-size:20px;margin:0 0 6px}.formrow{padding:18px 0;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:16px}.formrow label{flex:1}.formrow label small{display:block;color:var(--muted);margin-top:4px}.formrow input{width:220px}.switch{width:52px;min-height:32px;height:32px;padding:4px;background:#0f766e;position:relative}.switch:after{content:"";display:block;background:white;width:24px;height:24px;border-radius:50%;margin-left:20px}.switch.off{background:#91a59d}.switch.off:after{margin-left:0}.labelleft{width:210px;padding:16px;flex:none}.labelleft button{display:block;width:100%;text-align:left;border-radius:8px}.canvaspanel{flex:1;display:flex;flex-direction:column}.canvas{flex:1;display:grid;place-items:center;background:#edf1ef;min-height:280px}.paper{width:290px;height:174px;background:white;border:1px solid #9caea6;box-shadow:0 2px 8px #17362a15;padding:20px;position:relative}.paper strong{display:block;font-size:22px}.paper .labeltext{border:1px dashed #0f766e;padding:4px;cursor:pointer}.paper small{display:block;margin-top:8px}.qr{width:56px;height:56px;position:absolute;right:18px;bottom:18px;background:repeating-conic-gradient(#1b302b 0% 25%,white 0% 50%) 0/12px 12px;border:4px solid white;outline:1px solid #1b302b}.tabs{display:flex;border-bottom:1px solid var(--line);margin-bottom:20px}.tabs button{flex:1;border-radius:8px 8px 0 0;padding:0 8px}.field{display:block;margin:16px 0}.field input,.field select{width:100%;margin-top:6px}.toast{position:absolute;bottom:28px;left:50%;transform:translateX(-50%);background:#233e35;color:white;padding:14px 24px;border-radius:8px;z-index:9;box-shadow:0 4px 12px #0002}.overlay{position:absolute;inset:0;background:#172f2655;display:grid;place-items:center;z-index:10}.dialog{background:white;width:440px;padding:28px;border-radius:24px}.dialog h2{margin-top:0;font-size:22px}.dialog input{width:100%}.dialog .actions{justify-content:flex-end}.homegrid{padding:24px;display:grid;grid-template-columns:1fr 1fr;gap:16px}.homegrid button{height:132px;border:1px solid var(--line);text-align:left;border-radius:16px;background:white}.homegrid strong{display:block;font-size:20px}.empty{padding:48px;text-align:center;color:var(--muted)}@container (max-width:1000px){.sidepanel{display:none}.sidepanel.open{display:block;position:absolute;right:16px;top:90px;bottom:16px;z-index:5;box-shadow:0 8px 40px #14392b33;width:360px}.detail-toggle,.close-detail{display:inline-block}.content{padding:0 20px 20px}.pagehead{padding:24px 24px 16px}.labelleft{width:172px}.settingsnav{width:180px}.formrow{align-items:flex-start;flex-direction:column}.formrow input{width:100%}}@media(max-width:900px){.stage{padding:12px}.previewbar{padding:12px}.examples{padding:8px 12px}}
.inventorytable{table-layout:fixed}.inventorytable td,.inventorytable th{padding-left:10px;padding-right:10px}.inventorytable .modelname{max-width:none}.params{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.inventorytable .stock small{white-space:normal;font-size:11px}.labelgrid{display:grid;grid-template-columns:210px minmax(0,1fr) 300px;grid-template-rows:minmax(0,1fr)}.labelgrid>.labelleft{width:auto}.labelgrid>.sidepanel{width:auto}.labelgrid>.canvaspanel{min-height:0}.labelgrid .canvas{min-height:280px}.labelgrid .bottomline{flex-wrap:wrap}.labelgrid .bottomline>span:first-child{font-size:12px}.labelgrid .paper{width:min(290px,90%)}@container (max-width:1000px){.labelgrid{grid-template-columns:172px minmax(0,1fr)}.labelgrid>.sidepanel.open{width:340px}.labelgrid .canvas{min-height:420px}.labelgrid .bottomline{gap:8px}.inventorytable .modelname{font-size:13px}}</style></head><body>
<div class="previewbar"><strong>布局预览 · 合成数据 · 不保存库存</strong><span class="spacer"></span><button id="landscape" class="active" onclick="orientation(false)">横屏 1280 × 800</button><button id="portrait" onclick="orientation(true)">竖屏 840 × 1100</button></div>
<nav class="examples" aria-label="布局示例"><button class="active" data-page="inventory" onclick="showPage('inventory')">库存 · 列表详情</button><button data-page="bom" onclick="showPage('bom')">导入与 BOM</button><button data-page="labels" onclick="showPage('labels')">标签工具</button><button data-page="locations" onclick="showPage('locations')">库位与配套件</button><button data-page="settings" onclick="showPage('settings')">设置</button></nav>
<div class="stage"><div class="device" id="device"><nav class="rail" aria-label="应用导航"><div class="brand" id="brand"></div><button data-nav="home" onclick="showPage('home')"><span data-icon="home"></span>首页</button><button class="active" data-nav="inventory" onclick="showPage('inventory')"><span data-icon="inventory"></span>库存</button><button data-nav="records" onclick="showPage('records')"><span data-icon="records"></span>记录</button><div class="grow"></div><button data-nav="settings" onclick="showPage('settings')"><span data-icon="settings"></span>设置</button></nav><main class="workspace" id="workspace"></main><div class="toast hidden" id="toast" role="status"></div><div class="overlay hidden" id="overlay"></div></div></div>
<script>
const paths={home:'M3 10 12 3l9 7v11h-6v-7H9v7H3z',inventory:'M3 5h18v16H3z M3 10h18 M8 3v4 M16 3v4 M9 15h6',records:'M6 3h12v18H6z M9 8h6 M9 12h6 M9 16h4',settings:'M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8 M12 2v3 M12 19v3 M2 12h3 M19 12h3 M5 5l2 2 M17 17l2 2 M5 19l2-2 M17 7l2-2',box:'M3 6l9-4 9 4v13l-9 4-9-4z M3 6l9 4 9-4 M12 10v13'};function icon(n){return `<svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="${paths[n]||paths.box}"/></svg>`}document.querySelectorAll('[data-icon]').forEach(e=>e.innerHTML=icon(e.dataset.icon));document.querySelector('#brand').innerHTML=icon('box');
const items=[{sku:'IC-001',name:'STM32F103C8T6',spec:'LQFP48 · 32 位 MCU',loc:'A01-03',qty:48,min:10,type:'集成电路',maker:'STMicroelectronics',pack:'LQFP48'},{sku:'IC-002',name:'AMS1117-3.3',spec:'3.3 V · 1 A',loc:'A01-04',qty:125,min:20,type:'电源管理',maker:'合成厂商',pack:'SOT-223'},{sku:'C100',name:'FOJAN FRC0603F1002TS',spec:'10 kΩ · ±1% · 0.1 W · 0603',loc:'B02-01',qty:2400,min:100,type:'电阻',maker:'合成厂商',pack:'0603'},{sku:'C200',name:'三星 CL10B104KB8NNNC',spec:'100 nF · ±10% · 50 V · X7R · 0603',loc:'B03-02',qty:680,min:100,type:'电容',maker:'合成厂商',pack:'0603'},{sku:'IC-009',name:'CH340C',spec:'USB 转串口',loc:'A02-02',qty:6,min:10,type:'集成电路',maker:'合成厂商',pack:'SOP16'},{sku:'CON-005',name:'USB Type-C 插座',spec:'16 引脚 · 沉板',loc:'C01-01',qty:32,min:10,type:'连接器',maker:'合成厂商',pack:'沉板式'},{sku:'D-003',name:'SS14',spec:'40 V · 1 A',loc:'A03-01',qty:184,min:20,type:'二极管',maker:'合成厂商',pack:'SMA'}];let selected=0,page='inventory',filter='all',query='',labelTab='element';const $=s=>document.querySelector(s);function toast(t){$('#toast').textContent=t;$('#toast').classList.remove('hidden');clearTimeout(window.tt);window.tt=setTimeout(()=>$('#toast').classList.add('hidden'),2800)}function orientation(v){$('#device').classList.toggle('portrait',v);$('#landscape').classList.toggle('active',!v);$('#portrait').classList.toggle('active',v)}function head(title,sub,actions=''){return `<header class="pagehead"><div><h1>${title}</h1><div class="sub">${sub}</div></div><div class="grow"></div>${actions}</header>`}function toggleDetail(){document.querySelector('.sidepanel')?.classList.toggle('open')}function showPage(p){page=p;document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===p));document.querySelectorAll('[data-nav]').forEach(b=>b.classList.toggle('active',b.dataset.nav===(['bom','labels','locations'].includes(p)?'inventory':p)));render()}function render(){if(page==='inventory')inventory();else if(page==='bom')bom();else if(page==='labels')renderLabels();else if(page==='locations')locations();else if(page==='settings')settings();else if(page==='home')home();else records()}
function inventory(){const i=items[selected];$('#workspace').innerHTML=head('库存','7 种元件 · 本地库存',`<button class="outline" onclick="showPage('bom')">导入与 BOM</button><button class="outline" onclick="showPage('labels')">标签</button>`)+`<div class="content"><section class="panel mainpanel"><div class="toolbar"><input class="search" id="search" aria-label="搜索库存" placeholder="搜索型号、SKU、参数" value="${query}" oninput="query=this.value;rows()"><button class="outline detail-toggle" onclick="toggleDetail()">详情</button></div><div class="filters"><button class="pill ${filter==='all'?'active':''}" onclick="filter='all';inventory()">全部元件</button><button class="pill ${filter==='low'?'active':''}" onclick="filter='low';inventory()">低库存 1</button><button class="pill" onclick="showPage('locations')">库位与配套件</button></div><div class="tablewrap"><table class="inventorytable"><colgroup><col style="width:72px"><col style="width:28%"><col><col style="width:76px"><col style="width:90px"></colgroup><thead><tr><th>SKU</th><th>型号</th><th>参数</th><th>库位</th><th>库存</th></tr></thead><tbody id="rows"></tbody></table></div><div class="bottomline">选择一行查看详情<span class="grow"></span><span id="count"></span></div></section><aside class="panel sidepanel" id="detail">${detail(i)}</aside></div>`;rows()}
function rows(){let n=0;$('#rows').innerHTML=items.map((i,k)=>{if(filter==='low'&&i.qty>=i.min||query&&!Object.values(i).join(' ').toLowerCase().includes(query.toLowerCase()))return '';n++;return `<tr tabindex="0" data-row="${k}" class="${k===selected?'selected':''}" onclick="selectRow(${k})" onkeydown="if(event.key==='Enter')selectRow(${k})"><td><span class="sub">${i.sku}</span></td><td><strong class="modelname" title="${i.name}">${i.name}</strong></td><td><span class="params" title="${i.spec}">${i.spec}</span></td><td>${i.loc}</td><td class="stock ${i.qty<i.min?'low':''}">${i.qty.toLocaleString()}<small>${i.qty<i.min?'低于下限 '+i.min:'件'}</small></td></tr>`}).join('')||'<tr><td colspan="5" class="empty">没有符合条件的元件</td></tr>';$('#count').textContent=`${n} 项`}
function selectRow(k){selected=k;rows();$('#detail').innerHTML=detail(items[k]);if($('#device').clientWidth<1000)$('#detail').classList.add('open')}function detail(i){return `<div class="detailtop"><h2>${i.name}</h2><button class="close-detail" aria-label="关闭详情" onclick="toggleDetail()">收起</button></div><div class="sub">${i.sku} · ${i.type}</div><div class="photo"><div class="chipdrawing">示意</div><span>元件图片占位</span></div><div class="meta"><div><label>封装</label><strong>${i.pack}</strong></div><div><label>库位</label><strong>${i.loc}</strong></div><div><label>参数</label><strong>${i.spec}</strong></div><div><label>厂商</label><strong>${i.maker}</strong></div></div><div class="quantity"><b>${i.qty.toLocaleString()}</b>件<span class="grow"></span><span class="sub">下限 ${i.min} 件</span></div><div class="actions"><button class="primary" onclick="movement('入库')">入库</button><button class="outline" onclick="movement('出库')">出库</button><button onclick="edit()">编辑</button></div><h3 class="sectiontitle">最近记录</h3><div class="sub">10 月 26 日 · 初始导入<br>合成记录，仅用于展示详情结构</div><div class="note">操作只展示交互，不写入任何库存。</div>`}
function edit(){dialog('编辑元件',`<label class="field">型号<input value="${items[selected].name}"></label><label class="field">库位<input value="${items[selected].loc}"></label><div class="note">预览中的编辑内容不会保存。</div>`,'完成预览')}function movement(kind){dialog(kind+'预览',`<p>${items[selected].name}</p><label class="field">数量<input type="number" min="0" value="1"></label><div class="note">这是布局预览，确认不会改变库存。</div>`,'确认预览')}function dialog(title,body,action='完成预览'){const o=$('#overlay');o.innerHTML=`<section class="dialog" role="dialog" aria-modal="true" aria-label="${title}"><h2>${title}</h2>${body}<div class="actions"><button onclick="closeDialog()">取消</button><button class="primary" onclick="closeDialog();toast('预览完成，未保存数据')">${action}</button></div></section>`;o.classList.remove('hidden');o.querySelector('input,button')?.focus()}function closeDialog(){$('#overlay').classList.add('hidden')}
function bom(){const i=items[selected];$('#workspace').innerHTML=head('导入与 BOM','示例：环境传感器板 · 计划数量 5 块',`<button class="outline" onclick="toast('文件选择为预览，不读取文件')">选择文件</button><button class="detail-toggle outline" onclick="toggleDetail()">匹配详情</button>`)+`<div class="content"><section class="panel mainpanel"><div class="toolbar"><button class="active" onclick="toast('当前展示 BOM 复核示例')">BOM 复核</button><button onclick="toast('导入与 BOM 复用表格和逐项复核结构')">订单导入</button><span class="grow"></span><span class="sub">3 项已匹配 · 1 项待复核</span></div><div class="note" style="margin:16px">先核对物料与数量，再确认计划。此预览不会扣减库存。</div><div class="tablewrap"><table><thead><tr><th>物料 / 位号</th><th>需求</th><th>可用</th><th>匹配状态</th></tr></thead><tbody>${items.slice(0,4).map((x,k)=>`<tr data-row="${k}" tabindex="0" class="${selected===k?'selected':''}" onclick="selected=${k};bom();document.querySelector('.sidepanel').classList.add('open')"><td><strong>${x.name}</strong><small>${['U1','U2','R1–R4','C1–C6'][k]}</small></td><td>${[5,5,20,30][k]}</td><td>${x.qty}</td><td class="${k===3?'low':'stock'}">${k===3?'待确认封装':'已匹配'}</td></tr>`).join('')}</tbody></table></div><div class="bottomline">点击物料核对匹配<span class="grow"></span>4 项物料</div></section><aside class="panel sidepanel"><div class="detailtop"><h2>匹配与复核</h2><button class="close-detail" onclick="toggleDetail()">收起</button></div><h3 class="sectiontitle">${i.name}</h3><div class="meta"><div><label>库存 SKU</label><strong>${i.sku}</strong></div><div><label>封装</label><strong>${i.pack}</strong></div><div><label>库位</label><strong>${i.loc}</strong></div><div><label>当前库存</label><strong>${i.qty} 件</strong></div></div><button class="outline" onclick="toast('已模拟确认当前匹配，未保存')">确认本项匹配</button><h3 class="sectiontitle">本次摘要</h3><div class="sub">计划 5 块 · 4 种物料<br>3 项匹配完成 · 1 项需要复核</div><div class="note">尚有待复核物料。生产操作应在所有项目确认后单独执行。</div><button class="primary" style="width:100%" onclick="reviewBom()">复核待确认项</button></aside></div>`}
function reviewBom(){dialog('复核清单','<p>请核对 C1–C6 的封装与耐压。</p><div class="note">预览到此结束，没有实际导入、创建计划或扣库存。</div>','结束复核预览')}
function printLabel(){dialog('打印预览','<p>元件标签 · 50 × 30 mm · 1 张</p><div class="note">未连接打印机，此预览不会发送打印任务。</div>','完成预览')}
function setLabelTab(tab){const open=!!document.querySelector('.sidepanel.open');labelTab=tab;renderLabels();if(open)document.querySelector('.sidepanel').classList.add('open')}
function renderLabels(){ $('#workspace').innerHTML=head('标签工具','模板、画布与属性在同一工作区',`<button class="detail-toggle outline" onclick="toggleDetail()">属性</button>`)+`<div class="content labelgrid"><aside class="panel labelleft"><h3 class="sectiontitle" style="margin-top:0">模板</h3><button class="active" onclick="toast('已选元件标签模板')">元件标签</button><button onclick="toast('已模拟选择库位模板')">库位标签</button><h3 class="sectiontitle">元素</h3><button onclick="setLabelTab('element')">型号文字</button><button onclick="toast('已选 SKU 元素')">SKU</button><button onclick="toast('已选二维码元素')">二维码</button><div class="note">拖拽编辑将在实际实现中提供；此处可点击查看属性。</div></aside><section class="panel canvaspanel"><div class="toolbar"><strong>纸张 50 × 30 mm</strong><span class="grow"></span><span class="sub">100%</span></div><div class="canvas"><div class="paper"><strong class="labeltext" onclick="setLabelTab('element')">STM32F103C8T6</strong><small>IC-001 · LQFP48</small><small>库位 A01-03</small><div class="qr" title="二维码示意，无数据"></div></div></div><div class="bottomline"><span>合成标签 · 二维码为示意图案</span><span class="grow"></span><button class="primary" onclick="printLabel()">打印预览</button></div></section><aside class="panel sidepanel"><div class="detailtop"><h2>属性</h2><button class="close-detail" onclick="toggleDetail()">收起</button></div><div class="tabs"><button class="${labelTab==='element'?'active':''}" onclick="setLabelTab('element')">元素</button><button class="${labelTab==='paper'?'active':''}" onclick="setLabelTab('paper')">纸张</button></div>${labelTab==='element'?'<div class="sub">当前选择：型号文字</div><label class="field">内容<input value="STM32F103C8T6"></label><label class="field">字号<select><option>12 pt</option><option>10 pt</option><option>14 pt</option></select></label><div class="meta"><label class="field">X / mm<input type="number" value="3"></label><label class="field">Y / mm<input type="number" value="3"></label></div><button class="outline" onclick="toast(\'已模拟应用文字属性\')">应用预览</button>':'<label class="field">宽度 / mm<input type="number" value="50"></label><label class="field">高度 / mm<input type="number" value="30"></label><label class="field">方向<select><option>横向</option><option>纵向</option></select></label><div class="note">尺寸在画布标题持续显示，避免纸张设置与编辑分离。</div>'}</aside></div>`}
function locations(){const names=['A01 · 集成电路','A02 · 通信接口','B02 · 电阻','B03 · 电容','C01 · 连接器'];$('#workspace').innerHTML=head('库位与配套件','按库位查找元件，保持列表与内容的关联',`<button class="outline" onclick="showPage('inventory')">返回库存</button>`)+`<div class="content"><section class="panel" style="width:260px;flex:none"><div class="toolbar"><strong>库位</strong><span class="grow"></span><button onclick="toast('添加库位仅为布局占位')">添加</button></div><div class="simplelist">${names.map((n,k)=>`<button class="${k===0?'active':''}" onclick="document.querySelectorAll('.simplelist button').forEach(b=>b.classList.remove('active'));this.classList.add('active');document.querySelector('#locationTitle').textContent='${n}';toast('已切换库位示例')">${n}<small>${[2,1,1,1,1][k]} 种元件</small></button>`).join('')}</div></section><section class="panel mainpanel"><div class="toolbar"><strong id="locationTitle">A01 · 集成电路</strong><span class="grow"></span><button onclick="toast('库位编辑为预览')">编辑库位</button></div><div class="note" style="margin:16px">抽屉柜 A · 第 1 层<br>库位下的元件保持紧凑列表，可直接进入详情。</div><div class="simplelist">${items.slice(0,2).map((i,k)=>`<button onclick="selected=${k};showPage('inventory')"><strong>${i.name}</strong><small>${i.sku} · ${i.loc} · ${i.qty} 件</small></button>`).join('')}</div><div style="padding:20px"><h3 class="sectiontitle">配套件</h3><p class="sub">环境传感器板 · 4 种元件</p><button class="outline" onclick="showPage('bom')">查看物料清单</button></div></section></div>`}
let group='同步与账户';function settings(){const groups=['同步与账户','外观与显示','标签与打印','数据管理','关于应用'];$('#workspace').innerHTML=head('设置','本机配置 · 按分组逐项管理')+`<div class="content"><aside class="panel settingsnav">${groups.map(g=>`<button class="${g===group?'active':''}" onclick="group='${g}';settings()">${g}</button>`).join('')}</aside><section class="panel formpanel"><div class="formbody"><h2>${group}</h2>${group==='同步与账户'?'<p class="sub">当前使用本地库存，尚未连接服务器。</p><div class="formrow"><label>启用服务器同步<small>启用后再配置地址与账户</small></label><button class="switch off" aria-label="启用服务器同步" aria-pressed="false" onclick="this.classList.toggle(\'off\');this.setAttribute(\'aria-pressed\',!this.classList.contains(\'off\'))"></button></div><div class="formrow"><label for="server">服务器地址</label><input id="server" placeholder="https://你的服务器" disabled></div><div class="formrow"><label>账户<small>未绑定</small></label><button class="outline" onclick="toast(\'此处仅展示绑定入口，不发起网络请求\')">绑定账户</button></div><div class="note">服务器绑定与同步保持明确步骤，配置摘要只占一行。</div>':group==='外观与显示'?'<p class="sub">优先采用系统的显示偏好。</p><div class="formrow"><label>主题</label><select><option>跟随系统</option><option>浅色</option><option>深色</option></select></div><div class="formrow"><label>列表密度</label><select><option>标准</option><option>紧凑</option></select></div>':group==='标签与打印'?'<p class="sub">常用纸张：50 × 30 mm</p><div class="formrow"><label>标签模板与打印<small>在统一工作区编辑并预览</small></label><button class="outline" onclick="showPage(\'labels\')">打开标签工具</button></div>':group==='数据管理'?'<p class="sub">本地库存与备份</p><div class="formrow"><label>导出备份<small>合成预览不包含真实数据库</small></label><button class="outline" onclick="toast(\'预览不导出文件\')">导出</button></div>':'<p class="sub">Component Vault 平板布局提案</p><div class="note">合成数据 · 所有交互仅驻留内存 · 不连接业务服务</div>'}</div></section></div>`}
function home(){$('#workspace').innerHTML=head('首页','常用工作入口 · 合成数据')+`<div class="content"><section class="panel mainpanel"><div class="homegrid"><button onclick="showPage('inventory')"><strong>库存</strong><span class="sub">7 种元件 · 1 项低库存</span></button><button onclick="showPage('bom')"><strong>导入与 BOM</strong><span class="sub">核对物料，再执行操作</span></button><button onclick="showPage('labels')"><strong>标签工具</strong><span class="sub">模板、画布与属性</span></button><button onclick="showPage('locations')"><strong>库位与配套件</strong><span class="sub">按存放位置查找</span></button></div></section></div>`}function records(){$('#workspace').innerHTML=head('记录','合成操作记录')+`<div class="content"><section class="panel mainpanel"><div class="simplelist"><button onclick="toast('合成记录，无真实业务数据')">初始导入<small>10 月 26 日 · 7 种元件</small></button><button onclick="toast('合成记录，无真实业务数据')">库存盘点<small>10 月 25 日 · A01 库位</small></button></div></section></div>`}document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeDialog();document.querySelector('.sidepanel')?.classList.remove('open')}});showPage('inventory');
</script></body></html>
