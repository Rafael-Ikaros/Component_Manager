<svg xmlns="http://www.w3.org/2000/svg" width="720" height="325" viewBox="0 0 720 325" role="img" aria-labelledby="title description">
  <title id="title">API 容器高级设置</title>
  <desc id="description">宿主端口 8787 映射到容器端口 8787，协议 TCP。原数据目录以读写方式挂载到 /data。配图示例路径为 /docker/component-vault/data。</desc>
  <rect width="720" height="325" rx="20" fill="#f1f5f9"/>
  <g font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" fill="#13283e">
    <text x="28" y="44" font-size="28" font-weight="700">API 容器 · 高级设置</text>
    <text x="692" y="42" text-anchor="end" font-size="17" fill="#4b627a">设置示意</text>

    <rect x="28" y="67" width="664" height="91" rx="14" fill="white" stroke="#b9c9d8"/>
    <text x="48" y="100" font-size="21" font-weight="700">端口映射</text>
    <text x="672" y="100" text-anchor="end" font-size="19" fill="#405870">TCP</text>
    <text x="48" y="134" font-size="22" fill="#204478">宿主 8787</text>
    <text x="429" y="134" font-size="22" fill="#204478">容器 8787</text>
    <path d="M310 125h69m-8-6 8 6-8 6" fill="none" stroke="#536980" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

    <rect x="28" y="172" width="664" height="124" rx="14" fill="white" stroke="#b9c9d8"/>
    <text x="48" y="205" font-size="21" font-weight="700">存储空间</text>
    <text x="672" y="205" text-anchor="end" font-size="19" fill="#405870">读写</text>
    <text x="48" y="240" font-size="22" fill="#204478">原数据目录</text>
    <text x="429" y="240" font-family="Consolas, monospace" font-size="25" font-weight="700" fill="#204478">/data</text>
    <path d="M310 231h69m-8-6 8 6-8 6" fill="none" stroke="#536980" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="48" y="272" font-size="18" fill="#405870">示例</text>
    <text x="93" y="272" font-family="Consolas, monospace" font-size="19" fill="#405870">/docker/component-vault/data</text>
  </g>
</svg>
