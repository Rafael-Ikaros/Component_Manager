<svg xmlns="http://www.w3.org/2000/svg" width="720" height="316" viewBox="0 0 720 316" role="img" aria-labelledby="title description">
  <title id="title">Web 容器高级设置</title>
  <desc id="description">保留宿主 8081 到容器 80 的 TCP 映射。删除共享管理镜像预列的容器端口 8790 行，Web 存储映射留空。</desc>
  <rect width="720" height="316" rx="20" fill="#f1f5f9"/>
  <g font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" fill="#13283e">
    <text x="28" y="44" font-size="28" font-weight="700">Web 容器 · 高级设置</text>
    <text x="692" y="42" text-anchor="end" font-size="17" fill="#4b627a">设置示意</text>

    <rect x="28" y="67" width="664" height="154" rx="14" fill="white" stroke="#b9c9d8"/>
    <text x="48" y="100" font-size="21" font-weight="700">端口映射</text>
    <rect x="48" y="113" width="624" height="42" rx="8" fill="#e6f4f2"/>
    <text x="66" y="141" font-size="21" fill="#174c47">宿主 8081 → 容器 80</text>
    <text x="655" y="141" text-anchor="end" font-size="19" font-weight="700" fill="#174c47">保留 · TCP</text>
    <rect x="48" y="163" width="624" height="42" rx="8" fill="#fff0ed"/>
    <text x="66" y="191" font-size="21" fill="#792e23">容器端口 8790</text>
    <text x="655" y="191" text-anchor="end" font-size="19" font-weight="700" fill="#792e23">删除此行</text>

    <rect x="28" y="234" width="664" height="55" rx="14" fill="white" stroke="#b9c9d8"/>
    <text x="48" y="269" font-size="21" font-weight="700">存储空间</text>
    <text x="672" y="269" text-anchor="end" font-size="20" fill="#405870">留空</text>
  </g>
</svg>
